<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SparkleWash – Login / Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --primary: hsl(212, 100%, 47%);
            --primary-dark: hsl(212, 100%, 38%);
            --accent-teal: hsl(180, 80%, 42%);
            --bg-dark: hsl(220, 25%, 8%);
            --bg-card: hsl(220, 20%, 12%);
            --text-primary: hsl(210, 20%, 95%);
            --text-secondary: hsl(210, 15%, 65%);
            --border: hsla(210, 20%, 100%, 0.08);
            --radius-md: 16px;
            --radius-full: 9999px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Outfit', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .back-link {
            position: fixed;
            top: 24px;
            left: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 14px;
            text-decoration: none;
            transition: var(--transition);
        }

        .back-link:hover {
            color: var(--text-primary);
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            margin-bottom: 28px;
            font-family: 'Outfit', sans-serif;
            font-size: 22px;
            font-weight: 700;
        }

        .logo span:first-child {
            font-size: 28px;
        }

        .tabs {
            display: flex;
            background: hsla(210, 20%, 100%, 0.05);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 28px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            border-radius: 9px;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            transition: var(--transition);
        }

        .tab.active {
            background: var(--primary);
            color: #fff;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: hsla(210, 20%, 100%, 0.05);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: var(--transition);
        }

        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px hsla(212, 100%, 47%, 0.2);
        }

        .form-input::placeholder {
            color: hsl(210, 10%, 45%);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: var(--radius-full);
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--accent-teal));
            color: #fff;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-box {
            background: hsla(0, 70%, 55%, 0.12);
            border: 1px solid hsla(0, 70%, 55%, 0.3);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 13px;
            color: hsl(0, 70%, 70%);
            margin-bottom: 16px;
            display: none;
        }

        .success-box {
            background: hsla(145, 65%, 42%, 0.12);
            border: 1px solid hsla(145, 65%, 42%, 0.3);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 13px;
            color: hsl(145, 65%, 60%);
            margin-bottom: 16px;
            display: none;
        }

        .hidden-form {
            display: none;
        }

        .divider {
            text-align: center;
            color: var(--text-secondary);
            font-size: 13px;
            margin: 16px 0;
        }
    </style>
</head>

<body>
    <a href="/" class="back-link">← Back to website</a>

    <div class="card">
        <div class="logo"><span>🫧</span><span>SparkleWash</span></div>

        <div class="tabs">
            <button class="tab active" id="tab-login" onclick="showTab('login')">Log In</button>
            <button class="tab" id="tab-signup" onclick="showTab('signup')">Sign Up</button>
        </div>

        <div id="error-box" class="error-box"></div>
        <div id="success-box" class="success-box"></div>

        <!-- LOGIN FORM -->
        <div id="form-login">
            <div class="form-group">
                <label class="form-label">Phone Number</label>
                <input type="tel" id="login-phone" class="form-input" placeholder="+91 98765 43210" />
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="login-password" class="form-input" placeholder="Your password" />
            </div>
            <button class="btn btn-primary" id="login-btn" onclick="doLogin()">Log In →</button>
        </div>

        <!-- SIGNUP FORM -->
        <div id="form-signup" class="hidden-form">
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" id="signup-name" class="form-input" placeholder="Your full name" />
            </div>
            <div class="form-group">
                <label class="form-label">Phone Number</label>
                <input type="tel" id="signup-phone" class="form-input" placeholder="+91 98765 43210" />
            </div>
            <div class="form-group">
                <label class="form-label">Email (optional)</label>
                <input type="email" id="signup-email" class="form-input" placeholder="you@email.com" />
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="signup-password" class="form-input" placeholder="Min. 6 characters" />
            </div>
            <button class="btn btn-primary" id="signup-btn" onclick="doSignup()">Create Account →</button>
        </div>
    </div>

    <script>
        const errorBox = document.getElementById('error-box');
        const successBox = document.getElementById('success-box');

        function showTab(tab) {
            document.getElementById('tab-login').classList.toggle('active', tab === 'login');
            document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
            document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
            document.getElementById('form-signup').style.display = tab === 'signup' ? 'block' : 'none';
            hideMessages();
        }

        function showErr(msg) { errorBox.textContent = msg; errorBox.style.display = 'block'; successBox.style.display = 'none'; }
        function showOk(msg) { successBox.textContent = msg; successBox.style.display = 'block'; errorBox.style.display = 'none'; }
        function hideMessages() { errorBox.style.display = 'none'; successBox.style.display = 'none'; }

        function setLoading(btnId, loading) {
            const btn = document.getElementById(btnId);
            btn.disabled = loading;
            btn.textContent = loading ? 'Please wait...' : (btnId === 'login-btn' ? 'Log In →' : 'Create Account →');
        }

        async function doLogin() {
            hideMessages();
            const phone = document.getElementById('login-phone').value.trim();
            const password = document.getElementById('login-password').value;
            if (!phone || !password) return showErr('Please enter your phone number and password.');

            setLoading('login-btn', true);
            try {
                const res = await fetch('/api/customers/login', {
                    method: 'POST', credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, password })
                });
                const data = await res.json();
                if (data.success) {
                    showOk('Login successful! Redirecting...');
                    setTimeout(() => window.location.href = '/dashboard', 800);
                } else {
                    showErr(data.error || 'Login failed. Please try again.');
                }
            } catch { showErr('Could not connect to server. Is it running?'); }
            finally { setLoading('login-btn', false); }
        }

        async function doSignup() {
            hideMessages();
            const fullName = document.getElementById('signup-name').value.trim();
            const phone = document.getElementById('signup-phone').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value;
            if (!fullName || !phone || !password) return showErr('Please fill in all required fields.');
            if (password.length < 6) return showErr('Password must be at least 6 characters.');

            setLoading('signup-btn', true);
            try {
                const res = await fetch('/api/customers/register', {
                    method: 'POST', credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, phone, email, password })
                });
                const data = await res.json();
                if (data.success) {
                    showOk('Account created! Redirecting to your dashboard...');
                    setTimeout(() => window.location.href = '/dashboard', 900);
                } else {
                    showErr(data.errors ? data.errors.join(' ') : (data.error || 'Signup failed.'));
                }
            } catch { showErr('Could not connect to server.'); }
            finally { setLoading('signup-btn', false); }
        }

        // Allow Enter key on inputs
        document.addEventListener('keydown', e => {
            if (e.key !== 'Enter') return;
            const loginVisible = document.getElementById('form-login').style.display !== 'none';
            if (loginVisible) doLogin(); else doSignup();
        });

        // Check if already logged in
        fetch('/api/customers/me', { credentials: 'include' })
            .then(r => r.json())
            .then(d => { if (d.loggedIn) window.location.href = '/dashboard'; });
    </script>
</body>

</html>
